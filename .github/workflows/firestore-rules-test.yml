name: Firestore Rules Tests (Isolated Emulator)

on:
  push:
    branches:
      - draft/firebase-voidstore-connection
    paths:
      - "firestore.rules"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/firestore-rules-test.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log("Dependency audit: "+(v.total||0)+" total; "+(v.critical||0)+" critical, "+(v.high||0)+" high, "+(v.moderate||0)+" moderate, "+(v.low||0)+" low"); for (const [name,item] of Object.entries(a.vulnerabilities||{})) { console.log(item.severity+": "+name+" (range="+JSON.stringify(item.range)+", fixAvailable="+JSON.stringify(item.fixAvailable)+")"); for (const via of item.via||[]) if (typeof via==="object") console.log("  advisory: "+via.title+" | "+via.url+" | range="+via.range); }'
      - name: Run rules tests against local emulator
        run: npm run test:rules
      - name: Block release-quality CI on critical or high advisories
        if: always()
        run: |
          if [ ! -f npm-audit.json ]; then
            echo "::error::Dependency audit output is missing; security gate cannot pass."
            exit 1
          fi
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const counts = audit.metadata?.vulnerabilities ?? {};
            const critical = counts.critical ?? 0;
            const high = counts.high ?? 0;
            console.log("Security gate: " + critical + " critical, " + high + " high advisories.");
            if (critical > 0 || high > 0) {
              console.error("Security gate failed. Triage and resolve critical/high dependency advisories before release.");
              process.exit(1);
            }
          '
