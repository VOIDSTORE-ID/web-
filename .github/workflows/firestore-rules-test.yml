name: Firestore Rules Tests (Isolated Emulator)

on:
  push:
    branches:
      - draft/firebase-voidstore-connection
    paths:
      - "firestore.rules"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/firestore-rules-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log("Dependency audit: "+(v.total||0)+" total; "+(v.critical||0)+" critical, "+(v.high||0)+" high, "+(v.moderate||0)+" moderate, "+(v.low||0)+" low"); for (const [name,item] of Object.entries(a.vulnerabilities||{})) console.log(item.severity+": "+name+" (fixAvailable="+JSON.stringify(item.fixAvailable)+")");'
      - name: Run rules tests against local emulator
        run: npm run test:rules
